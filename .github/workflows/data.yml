# Check that the Lean's data files are what paper/code generates, only when either changes (about 2 minutes).
# Runs in SPECTRE_KNOT_PROOF_DEV (private, so it uses the account's Actions minutes) and in SPECTRE_KNOT_PROOF, where
# it skips while that repo is private and is free once it is public.
name: data
on:
  push:
    paths: ['paper/code/**', 'lean/tools/**', 'lean/SpectreKnot/Data/**', '.github/workflows/data.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  data:
    if: github.repository != 'Cortado-J/SPECTRE_KNOT_PROOF' || !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: The data files are what paper/code generates
        run: lean/tools/check_data.sh
